services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicos
      POSTGRES_PASSWORD: aicos
      POSTGRES_DB: aicos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicos -d aicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://aicos:aicos@postgres:5432/aicos
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-compose-jwt-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-compose-encryption-passphrase}
      CORS_ORIGINS: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  crewai-adapter:
    build:
      context: ./apps/workers/crewai_adapter
    environment:
      REDIS_URL: redis://redis:6379/0
      OTEL_SDK_DISABLED: "true"
      CREWAI_FORCE_MOCK: ${CREWAI_FORCE_MOCK:-1}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
